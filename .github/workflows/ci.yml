name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The API against a real PostgreSQL: player isolation, admin rights, quota, rate limits, account deletion.
  server-integration:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: caseprompt
          POSTGRES_PASSWORD: caseprompt
          POSTGRES_DB: caseprompt_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U caseprompt"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://caseprompt:caseprompt@localhost:5432/caseprompt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:int

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build

  # Deploys main to the VPS. Needs the secrets VPS_HOST, VPS_USER, VPS_SSH_KEY and the repo cloned in /opt/case-prompt.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server, server-integration, web]
    runs-on: ubuntu-latest
    env:
      HAS_VPS: ${{ secrets.VPS_HOST != '' }}
    steps:
      - name: Deploy over SSH
        if: env.HAS_VPS == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: cd /opt/case-prompt && git pull --ff-only && docker compose up -d --build
      - name: Skip
        if: env.HAS_VPS != 'true'
        run: echo "No VPS secrets configured, deployment skipped."
