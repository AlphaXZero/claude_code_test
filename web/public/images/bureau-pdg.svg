<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1a2338"/></linearGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0a43a" stop-opacity=".35"/><stop offset="1" stop-color="#e0a43a" stop-opacity="0"/></linearGradient>
    <pattern id="rain" width="24" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(12)"><line x1="4" y1="0" x2="4" y2="16" stroke="#8fa6c8" stroke-opacity=".35" stroke-width="1.2"/></pattern>
  </defs>
  <rect width="800" height="600" fill="#12141b"/>
  <!-- Window -->
  <rect x="80" y="50" width="640" height="300" fill="url(#sky)"/>
  <g fill="#0a0d16">
    <rect x="100" y="210" width="60" height="140"/><rect x="170" y="170" width="50" height="180"/><rect x="230" y="240" width="80" height="110"/>
    <rect x="330" y="150" width="45" height="200"/><rect x="390" y="200" width="70" height="150"/><rect x="480" y="120" width="55" height="230"/>
    <rect x="550" y="190" width="70" height="160"/><rect x="630" y="230" width="70" height="120"/>
  </g>
  <g fill="#e0a43a" fill-opacity=".55">
    <rect x="182" y="190" width="6" height="8"/><rect x="200" y="220" width="6" height="8"/><rect x="342" y="180" width="6" height="8"/>
    <rect x="495" y="150" width="6" height="8"/><rect x="510" y="200" width="6" height="8"/><rect x="570" y="220" width="6" height="8"/><rect x="250" y="270" width="6" height="8"/>
  </g>
  <rect x="80" y="50" width="640" height="300" fill="url(#rain)"/>
  <g stroke="#2a2f3d" stroke-width="8" fill="none"><rect x="80" y="50" width="640" height="300"/><line x1="400" y1="50" x2="400" y2="350"/></g>
  <!-- Archive door -->
  <rect x="700" y="160" width="90" height="300" fill="#1d2029" stroke="#2e3342" stroke-width="3"/>
  <circle cx="715" cy="320" r="5" fill="#b08a4a"/>
  <!-- Floor -->
  <rect y="430" width="800" height="170" fill="#191b22"/>
  <ellipse cx="560" cy="520" rx="110" ry="26" fill="#3a1414" fill-opacity=".7"/>
  <path d="M480 515 q40 -30 80 -5 q30 -25 70 0 q-20 25 -70 20 q-50 10 -80 -15z" fill="none" stroke="#ece6d6" stroke-opacity=".6" stroke-dasharray="6 5" stroke-width="2"/>
  <!-- Lamp light -->
  <polygon points="250,300 120,520 420,520" fill="url(#lamp)"/>
  <!-- Desk -->
  <rect x="100" y="400" width="340" height="24" fill="#4a3220"/>
  <rect x="120" y="424" width="300" height="90" fill="#3b2818"/>
  <rect x="230" y="440" width="80" height="26" fill="#2c1e12" stroke="#5a3e28"/><rect x="262" y="450" width="16" height="5" fill="#b08a4a"/>
  <!-- Computer, cup, photo -->
  <rect x="300" y="330" width="110" height="70" rx="4" fill="#0c0e13" stroke="#2e3342" stroke-width="3"/><rect x="345" y="400" width="20" height="6" fill="#2e3342"/>
  <rect x="150" y="378" width="22" height="22" rx="3" fill="#ece6d6"/><path d="M172 384 q10 4 0 10" stroke="#ece6d6" stroke-width="3" fill="none"/>
  <rect x="200" y="370" width="30" height="30" fill="#2a2f3d" stroke="#b08a4a"/>
  <!-- Bin -->
  <path d="M470 440 l70 0 l-8 70 l-54 0z" fill="#262a35" stroke="#3a3f4e"/>
  <g stroke="#ece6d6" stroke-opacity=".7" stroke-width="2"><line x1="480" y1="440" x2="476" y2="428"/><line x1="492" y1="440" x2="496" y2="425"/><line x1="505" y1="440" x2="503" y2="430"/><line x1="518" y1="440" x2="524" y2="426"/><line x1="530" y1="440" x2="528" y2="431"/></g>
  <!-- Badge register -->
  <rect x="610" y="390" width="70" height="40" fill="#2a2f3d"/><rect x="618" y="380" width="54" height="12" fill="#ece6d6" transform="rotate(-4 645 386)"/>
</svg>
